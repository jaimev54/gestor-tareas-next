# Evita que Supabase pause el proyecto del plan gratuito (se pausa tras 7 días sin actividad).
# Cada 3 días llama a la función public.ping() (migración 0004).
#
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_URL             https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY la clave publishable (la misma de .env.local; NUNCA la secret)
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 9 */3 * *" # 09:17 UTC cada 3 días (minuto "raro" para evitar la hora punta de GitHub)
  workflow_dispatch: # botón "Run workflow" para probarlo a mano

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consulta ligera a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL o SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Respuesta: HTTP $status $(cat response.txt)"
          test "$status" = "200"
